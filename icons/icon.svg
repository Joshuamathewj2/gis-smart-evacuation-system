<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d32f2f" />
      <stop offset="100%" stop-color="#b71c1c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Outer Dark Rounded Square -->
  <rect width="512" height="512" rx="100" fill="#121820"/>
  
  <!-- Shield Badge -->
  <path d="M 256 50 C 370 50 420 110 420 230 C 420 360 256 460 256 460 C 256 460 92 360 92 230 C 92 110 142 50 256 50 Z" 
        fill="url(#shieldGrad)" filter="url(#shadow)"/>
  
  <!-- Inner Shelter / Evacuation Icon -->
  <!-- Roof -->
  <path d="M 256 120 L 370 215 L 350 215 L 350 350 L 162 350 L 162 215 L 142 215 Z" fill="#ffffff" opacity="0.95"/>
  
  <!-- Evacuation Arrow pointing to safety door -->
  <rect x="230" y="240" width="52" height="110" rx="6" fill="#b71c1c" />
  
  <!-- Running person / safety exit symbol in door -->
  <circle cx="256" cy="270" r="12" fill="#ffffff"/>
  <path d="M 244 325 L 253 295 L 263 305 L 274 290" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 253 295 L 242 305" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/>
  
  <!-- Cross on top of roof -->
  <path d="M 250 155 H 262 V 185 H 250 Z M 240 165 H 272 V 175 H 240 Z" fill="#b71c1c"/>
</svg>
